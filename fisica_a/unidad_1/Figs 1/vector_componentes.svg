<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" font-family="sans-serif" font-size="16">
  <defs>
    <marker id="ejes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#888"/>
    </marker>
    <marker id="vec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b7bd6"/>
    </marker>
    <marker id="comp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d6492b"/>
    </marker>
  </defs>

  <!-- Ejes -->
  <line x1="60" y1="270" x2="380" y2="270" stroke="#888" stroke-width="2" marker-end="url(#ejes)"/>
  <line x1="60" y1="270" x2="60" y2="20" stroke="#888" stroke-width="2" marker-end="url(#ejes)"/>
  <text x="372" y="292" fill="#888"><tspan font-style="italic">x</tspan></text>
  <text x="38" y="30" fill="#888"><tspan font-style="italic">y</tspan></text>

  <!-- Proyecciones punteadas -->
  <line x1="300" y1="130" x2="300" y2="270" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="60" y1="130" x2="300" y2="130" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Componentes -->
  <line x1="60" y1="270" x2="298" y2="270" stroke="#d6492b" stroke-width="3" marker-end="url(#comp)"/>
  <line x1="60" y1="270" x2="60" y2="132" stroke="#d6492b" stroke-width="3" marker-end="url(#comp)"/>

  <!-- Vector -->
  <line x1="60" y1="270" x2="298" y2="131" stroke="#2b7bd6" stroke-width="4" marker-end="url(#vec)"/>

  <!-- Ángulo -->
  <path d="M120 270 A60 60 0 0 0 111.8 240" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="128" y="262" fill="#888">θ</text>

  <!-- Etiquetas -->
  <text x="165" y="185" fill="#2b7bd6" font-weight="bold" font-style="italic">A</text>
  <text x="170" y="294" fill="#d6492b"><tspan font-style="italic">A</tspan><tspan dy="5" font-size="12">x</tspan></text>
  <text x="22" y="205" fill="#d6492b"><tspan font-style="italic">A</tspan><tspan dy="5" font-size="12">y</tspan></text>
</svg>
